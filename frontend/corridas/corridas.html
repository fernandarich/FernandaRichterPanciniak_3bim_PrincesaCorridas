<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Corridas</title>
    <link rel="stylesheet" href="corridas.css">
</head>

<body onload="listar()">
    <header>
        <h1>Cadastro das corridas</h1>
        <p>Gerencie as corridas que terão.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados da Corrida</h2>
                
                <label for="inputId_corrida">ID da Corrida(Até 2 digitos)</label>
                <div class="linha-id">
                    <input type="number" name="inputId_corrida" id="inputId_corrida" min="1" maxlength="2" placeholder="Ex: 01" style="text-transform: uppercase;">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_corrida">Nome da Corrida</label>
                <input type="text" name="inputNome_corrida" id="inputNome_corrida" placeholder="Ex: Etapa Tuneiras MX">

                <label for="inputCidade">Cidade da corrida</label>
                <input type="text" name="inputCidade" id="inputCidade" placeholder="Ex: Campo Mourão">

                <label for="inputData">Data da corrida</label>
                <input type="date" name="inputData" id="inputData">

                <label for="selectCategoria">Qual categoria você corre?</label>
                    <select name="selectCategoria" id="selectCategoria" disabled>
                        <option value="">Carregando...</option>
                </select>

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

            <aside class="form-direita">
                <h2>Imagem da Pista</h2>
                <p class="instrucao-imagem">(Clique na imagem para alterar)</p>
                <div class="img-container">
                    <img id="imgMoto" src="../imagens/silhueta.png" alt="Imagem da Pista" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;"
                        onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <section class="lista-unidades">
            <h3>Corridas Cadastradas</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Corridas. Todos os direitos reservados.</p>
    </footer>

    <script src="./corridas.js"></script>
</body>

</html>
