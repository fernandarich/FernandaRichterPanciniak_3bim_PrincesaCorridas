<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Pessoas e Pilotos</title>
    <link rel="stylesheet" href="pessoa.css">
</head>

<body onload="listar()">
    <header>
        <h1>Cadastro de Pessoas</h1>
        <p>Gerencie os pilotos do sistema.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados da Pessoa</h2>

                <label for="inputId_pessoa">ID do Cadastro (Até 2 digitos)</label>
                <div class="linha-id">
                    <input type="number" name="inputId_pessoa" id="inputId_pessoa" min="1" maxlength="2" placeholder="Ex: 01"
                        style="text-transform: uppercase;">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome">Nome completo</label>
                <input type="text" name="inputNome" id="inputNome" placeholder="Ex: Bruno Mezenga"><br>
                <label for="inputData_nascimento">Data de nascimento</label>
                <input type="date" name="inputData_nascimento" id="inputData_nascimento"
                    placeholder="Ex: 01/01/2001"><br>
                <label for="inputCidade">Cidade que mora</label>
                <input type="text" name="inputCidade" id="inputCidade" placeholder="Ex: Campo Mourão"><br>
                <label for="inputTelefone">inputTelefone</label>
                <input type="number" name="inputTelefone" id="inputTelefone" placeholder="Ex: 44988887777"><br>

                <label for="inputPiloto">Você é piloto?</label>
                <input type="checkbox" name="inputPiloto" id="inputPiloto"><br>

                <div id="areaFicha" style="display: none;">
                    <label for="inputNumero">Número do piloto</label>
                    <input type="number" name="inputNumero" id="inputNumero" placeholder="Ex: 618">
                    <br>
                    <label for="selectId_moto">Selecione sua moto</label>
                    <select name="selectId_moto" id="selectId_moto" disabled>
                        <option value="">Carregando...</option>
                    </select><br>
                    <label for="selectId_categoria">Qual categoria você corre?</label>
                    <select name="selectId_categoria" id="selectId_categoria" disabled>
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()"
                        style="display:none;">
                </div>
            </section>

            <aside class="form-direita">
                <h2>Imagem do Piloto</h2>
                <p class="instrucao-imagem">(Clique na imagem para alterar)</p>
                <div class="img-container">
                    <img id="imgMoto" src="../imagens/silhueta.png" alt="Imagem do Piloto" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;"
                        onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <section class="lista-unidades">
            <h3>Pessoas Cadastradas</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Pessoas Todos os direitos reservados.</p>
    </footer>

    <script src="./pessoa.js"></script>
</body>

</html>
